services:
    _defaults:
        autowire: true
        autoconfigure: true

    #
    # RUNTIME CACHE
    #

    pimcore.cache.adapter.null:
        class: Symfony\Component\Cache\Adapter\NullAdapter

    pimcore.cache.adapter.null_tag_aware:
        public: true
        class: Symfony\Component\Cache\Adapter\TagAwareAdapter
        arguments: ['@pimcore.cache.adapter.null', null]

    # The default pool of this kernel: node-local files under var/cache
    # (guardian-kernel; guardian-runner roadmap M5 invalidates it from
    # Guardian commits). There is no database to keep it in.
    pimcore.cache.adapter.filesystem_tag_aware:
        class: Symfony\Component\Cache\Adapter\FilesystemTagAwareAdapter
        arguments:
            - 'pimcore'
            - 31536000  # 1 year
            - '%kernel.cache_dir%/../pimcore-cache'

    pimcore.cache.adapter.redis_tag_aware: '@cache.adapter.redis_tag_aware'

    pimcore.cache.pool.app:
        class: Symfony\Component\Cache\Adapter\ProxyAdapter
        arguments:
            - '@pimcore.cache.pool'
            - 'app'

    #
    # PIMCORE CACHE
    #

    # the actual core handler which is used from Pimcore\Cache
    # the pimcore.cache.core.pool service is defined by config
    # and set in PimcoreExtension

    Pimcore\Cache\Core\CoreCacheHandler:
        public: true
        arguments:
            - '@pimcore.cache.pool'
            - '@Pimcore\Cache\Core\WriteLock'
            - '@event_dispatcher'
        calls:
            - [setLogger, ['@logger']]
        tags:
            - { name: monolog.logger, channel: cache }

    # write lock handles locking between processes
    Pimcore\Cache\Core\WriteLock:
        arguments: ['@pimcore.cache.pool']
        calls:
            - [setLogger, ['@logger']]
        tags:
            - { name: monolog.logger, channel: cache }
